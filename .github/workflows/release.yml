name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write # signs the build provenance
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags, to find the previous release for the notes
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Check the tag matches manifest.json
        run: |
          test "$(node -p "require('./manifest.json').version")" = "${GITHUB_REF_NAME}"
      # a signed record that these files were built from this commit by this workflow (see "gh attestation verify")
      - name: Attest the release files
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      # 1.x and later are normal releases, published as the latest; 0.x versions were betas, so they stay drafts marked as pre-releases
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "${GITHUB_REF_NAME}" in
            0.*) flags="--draft --prerelease" ;;
            *) flags="--latest" ;;
          esac
          # the notes are CHANGELOG.md from this version down to the previous release's
          prev="$(git tag --sort=-v:refname | grep -vx "${GITHUB_REF_NAME}" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -1)"
          awk -v v="## ${GITHUB_REF_NAME}" -v p="## ${prev}" '$0 == v || index($0, v " ") == 1 { f = 1 } p != "## " && ($0 == p || index($0, p " ") == 1) { exit } f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md for what's new." > notes.md
          gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css \
            $flags --title "${GITHUB_REF_NAME}" --notes-file notes.md
